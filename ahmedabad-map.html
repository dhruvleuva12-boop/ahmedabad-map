<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmedabad City Explorer — Interactive Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1626;
    --ink-2:#161F35;
    --ink-3:#212C47;
    --paper:#FAF7F0;
    --paper-2:#F0EBDD;
    --line:rgba(255,255,255,0.10);
    --line-light:rgba(15,22,38,0.12);
    --river:#1E8A8A;
    --terracotta:#C9622D;
    --kite-green:#3E7C59;
    --kite-gold:#D9A441;
    --kite-pink:#C24D6B;
    --muted:#8891A6;
    --muted-light:#6B7280;
    --text:#EDEEF2;
    --text-dim:#AEB4C4;
    --radius:8px;
    --shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:'Inter',sans-serif;}
  body{
    background:var(--ink);
    color:var(--text);
    overflow:hidden;
  }
  #app{position:relative;width:100vw;height:100vh;}
  #map{position:absolute;inset:0;background:var(--ink);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    pointer-events:auto;
    background:rgba(15,22,38,0.82);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    padding:9px 16px 9px 12px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .brand svg{display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-text .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15.5px; letter-spacing:0.2px;}
  .brand-text .sub{font-size:10.5px; color:var(--text-dim); margin-top:2px;}
  .kite-thread{width:34px;height:2px;background:linear-gradient(90deg,var(--kite-gold),var(--kite-pink),var(--river));border-radius:2px;margin-top:4px;}

  .top-actions{display:flex; gap:8px; pointer-events:auto;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius);
    background:rgba(15,22,38,0.82); backdrop-filter:blur(10px);
    border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{background:var(--ink-3);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.active{background:var(--terracotta); border-color:var(--terracotta);}

  /* ---------- Search ---------- */
  .search-wrap{
    position:absolute; top:70px; left:18px; z-index:1000;
    width:300px; max-width:calc(100vw - 36px);
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:rgba(15,22,38,0.88); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; box-shadow:var(--shadow);
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:'Inter'; font-size:13.5px;
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-results{
    margin-top:6px; background:rgba(15,22,38,0.92); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:var(--radius);
    max-height:260px; overflow-y:auto; box-shadow:var(--shadow); display:none;
  }
  .search-results.show{display:block;}
  .search-result-item{
    padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px;
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--ink-3);}
  .search-result-item .r-name{font-weight:600;}
  .search-result-item .r-cat{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px;}

  /* ---------- Layers panel ---------- */
  .panel{
    position:absolute; z-index:1000;
    background:rgba(15,22,38,0.90); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); color:var(--text);
  }
  .layers-panel{ top:70px; right:18px; width:238px; max-height:calc(100vh - 200px); overflow-y:auto;}
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px 10px; border-bottom:1px solid var(--line);
    font-family:'Space Grotesk'; font-weight:600; font-size:13px; letter-spacing:0.2px;
  }
  .panel-header .close-x{cursor:pointer; color:var(--muted); font-size:16px; line-height:1;}
  .panel-body{padding:10px 14px 14px;}
  .layer-group-title{font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin:10px 0 6px;}
  .layer-group-title:first-child{margin-top:0;}
  .layer-row{
    display:flex; align-items:center; gap:9px; padding:6px 2px; cursor:pointer; font-size:13px;
  }
  .layer-row input{accent-color:var(--terracotta); width:15px; height:15px; cursor:pointer;}
  .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .swatch.line{height:3px;border-radius:2px;}

  /* ---------- Legend / zone panel ---------- */
  .legend-panel{ left:18px; bottom:18px; width:230px; }
  .legend-panel.collapsed .panel-body{display:none;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:12px; padding:4px 0; color:var(--text-dim);}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  /* ---------- Bottom-right controls ---------- */
  .zoom-controls{
    position:absolute; right:18px; bottom:18px; z-index:1000;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ---------- Popups ---------- */
  .leaflet-popup-content-wrapper{
    background:var(--ink-2); color:var(--text); border-radius:10px; border:1px solid var(--line);
  }
  .leaflet-popup-tip{background:var(--ink-2);}
  .leaflet-popup-content{margin:12px 14px; font-family:'Inter';}
  .pop-cat{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--terracotta); font-weight:600;}
  .pop-title{font-family:'Space Grotesk'; font-weight:700; font-size:15px; margin:3px 0 4px;}
  .pop-desc{font-size:12.5px; color:var(--text-dim); line-height:1.4;}
  .leaflet-popup-close-button{color:var(--muted) !important;}

  /* ---------- Custom markers ---------- */
  .divicon{display:flex; align-items:center; justify-content:center;}
  .marker-pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,0.4);
    border:2px solid rgba(255,255,255,0.85);
  }
  .marker-pin .in{transform:rotate(45deg); font-size:12px; color:#fff;}
  .area-label{
    font-family:'Space Grotesk'; font-weight:600; font-size:11.5px; color:var(--text);
    background:rgba(15,22,38,0.55); padding:2px 7px; border-radius:5px; white-space:nowrap;
    border:1px solid rgba(255,255,255,0.14); pointer-events:none;
  }
  body.light .area-label{color:var(--ink); background:rgba(255,255,255,0.72); border-color:rgba(15,22,38,0.14);}
  .zone-label{
    font-family:'Space Grotesk'; font-weight:700; font-size:13px; letter-spacing:0.4px;
    text-transform:uppercase; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }

  /* ---------- Light mode overrides ---------- */
  body.light{background:var(--paper);}
  body.light .brand,
  body.light .icon-btn,
  body.light .search-box,
  body.light .search-results,
  body.light .panel{
    background:rgba(255,255,255,0.88); color:var(--ink); border-color:var(--line-light);
  }
  body.light .brand-text .name, body.light .pop-title, body.light .panel-header{color:var(--ink);}
  body.light .brand-text .sub, body.light .text-dim, body.light .pop-desc, body.light .layer-group-title{color:var(--muted-light);}
  body.light .search-box input{color:var(--ink);}
  body.light .search-box input::placeholder{color:var(--muted-light);}
  body.light .search-result-item:hover{background:var(--paper-2);}
  body.light .icon-btn:hover{background:var(--paper-2);}
  body.light .leaflet-popup-content-wrapper, body.light .leaflet-popup-tip{background:#fff; color:var(--ink); border-color:var(--line-light);}
  body.light .pop-desc{color:#5B6272;}

  /* ---------- Attribution tweak ---------- */
  .leaflet-control-attribution{
    background:rgba(15,22,38,0.6) !important; color:var(--text-dim) !important; font-size:10px !important;
  }
  .leaflet-control-attribution a{color:var(--text-dim) !important;}
  body.light .leaflet-control-attribution{background:rgba(255,255,255,0.7) !important; color:#555 !important;}

  /* ---------- Welcome / intro card ---------- */
  .intro-card{
    position:absolute; z-index:999; left:50%; bottom:22px; transform:translateX(-50%);
    background:rgba(15,22,38,0.9); backdrop-filter:blur(10px); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 16px; box-shadow:var(--shadow);
    font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:10px;
  }
  body.light .intro-card{background:rgba(255,255,255,0.9); color:var(--muted-light);}
  .intro-card b{color:var(--text);}
  body.light .intro-card b{color:var(--ink);}
  .intro-card .dismiss{cursor:pointer; color:var(--terracotta); font-weight:600; margin-left:6px;}

  /* ---------- Mobile ---------- */
  @media (max-width: 720px){
    .search-wrap{width:calc(100vw - 36px);}
    .layers-panel{ top:auto; bottom:18px; right:18px; left:18px; width:auto; max-height:56vh;
      transform:translateY(calc(100% + 20px)); transition:transform .25s ease; }
    .layers-panel.open{transform:translateY(0);}
    .brand .sub{display:none;}
    .legend-panel{display:none;}
    .zoom-controls{bottom:18px;}
    .intro-card{width:calc(100vw - 36px); font-size:11px; text-align:center; flex-wrap:wrap; justify-content:center;}
  }
</style>
</head>

    </div>

</div>

--------------------------------------------------------------------- */

function pinIcon(color, glyph, size){
  size = size || 26;
  return L.divIcon({
    className:'divicon',
    html:`<div class="marker-pin" style="background:${color}"><span class="in">${glyph}</span></div>`,
    iconSize:[size,size], iconAnchor:[size/2,size], popupAnchor:[0,-size]
  });
}
function labelIcon(text, weight){
  return L.divIcon({
    className:'divicon',
    html:`<div class="area-label">${text}</div>`,
    iconSize:[0,0], iconAnchor:[-6,6]
  });
}

/* -- Areas -- */
const searchIndex = [];
AREAS.forEach(([name, latlng, zone])=>{
  const m = L.marker(latlng,{icon:labelIcon(name)});
  m.bindPopup(`<div class="pop-cat">Area · ${zone} Ahmedabad</div><div class="pop-title">${name}</div><div class="pop-desc">Neighbourhood in ${zone} Ahmedabad.</div>`);
  layerAreas.addLayer(m);
  const dot = L.circleMarker(latlng,{radius:3,color:"#fff",weight:1,fillColor:"#D9A441",fillOpacity:0.9});
  layerAreas.addLayer(dot);
  searchIndex.push({name, latlng, cat:"Area · "+zone, zoom:14});
});

/* -- Zones -- */

  circle.bindPopup(`<div class="pop-cat">Zone</div><div class="pop-title">${name}</div><div class="pop-desc">Approximate zone boundary for orientation.</div>`);
  layerZones.addLayer(circle);
  const lbl = L.marker(latlng,{icon:L.divIcon({className:'divicon', html:`<div class="zone-label" style="color:${color}">${name}</div>`, iconSize:[0,0]})});
  layerZones.addLayer(lbl);

});

/* -- Metro -- */
function buildMetro(stations, color, lineName){
  const pts = stations.map(s=>s[1]);

  line.bindPopup(`<div class="pop-cat">Metro</div><div class="pop-title">${lineName}</div>`);
  layerMetro.addLayer(line);
  stations.forEach(([nm, latlng])=>{
    const m = L.circleMarker(latlng,{radius:5, color:"#fff", weight:1.5, fillColor:color, fillOpacity:1});
    m.bindPopup(`<div class="pop-cat">${lineName} Station</div><div class="pop-title">${nm}</div>`);
    layerMetro.addLayer(m);
    searchIndex.push({name:"Metro · "+nm, latlng, cat:lineName, zoom:15});
  });
}

/* ---------------------------------------------------------------------
   SEARCH
--------------------------------------------------------------------- */
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchMarker = null;

function renderResults(list){
  searchResults.innerHTML = '';
  if(list.length===0){ searchResults.classList.remove('show'); return; }
  list.slice(0,8).forEach(r=>{
    const div = document.createElement('div'); div.className='search-result-item';
    div.innerHTML = `<span class="r-name">${r.name}</span><span class="r-cat">${r.cat}</span>`;
    div.addEventListener('click', ()=>{
      map.setView(r.latlng, r.zoom, {animate:true});
      if(searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker(r.latlng,{icon:pinIcon('#C9622D','★',30)}).addTo(map)
        .bindPopup(`<div class="pop-cat">${r.cat}</div><div class="pop-title">${r.name}</div>`).openPopup();
      searchResults.classList.remove('show');
      searchInput.value = r.name;
    });
    searchResults.appendChild(div);
  });
  searchResults.classList.add('show');
}
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(q.length<1){ searchResults.classList.remove('show'); return; }
  const matches = searchIndex.filter(r=> r.name.toLowerCase().includes(q));
  renderResults(matches);
});
searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim()) searchResults.classList.add('show'); });
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

--------------------------------------------------------------------- */

document.getElementById('btn-zoomout').addEventListener('click', ()=> map.zoomOut());

document.getElementById('btn-theme').addEventListener('click', ()=>{
  const isLight = document.body.classList.toggle('light');
  if(isLight){ map.removeLayer(darkTiles); lightTiles.addTo(map); }
  else { map.removeLayer(lightTiles); darkTiles.addTo(map); }
});

const layersPanel = document.getElementById('layers-panel');
const btnLayers = document.getElementById('btn-layers');
function toggleLayersPanel(force){
  const willOpen = force !== undefined ? force : !layersPanel.classList.contains('open');
  if(window.innerWidth <= 720){
    layersPanel.classList.toggle('open', willOpen);
  } else {
    layersPanel.style.display = willOpen ? 'block' : 'none';
  }
  btnLayers.classList.toggle('active', willOpen);
}
layersPanel.style.display = window.innerWidth<=720 ? 'block' : 'block';
btnLayers.addEventListener('click', ()=> toggleLayersPanel());
document.getElementById('layers-close').addEventListener('click', ()=> toggleLayersPanel(false));

document.getElementById('btn-locate').addEventListener('click', ()=>{
  const btn = document.getElementById('btn-locate');
  if(!navigator.geolocation){ alert('Geolocation not supported in this browser.'); return; }
  btn.classList.add('active');
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove('active');
    const latlng = [pos.coords.latitude, pos.coords.longitude];
    L.circleMarker(latlng,{radius:8, color:'#fff', weight:2, fillColor:'#2FB6C9', fillOpacity:1}).addTo(map)
      .bindPopup('<div class="pop-cat">You are here</div>').openPopup();
    map.setView(latlng, 15);
  }, ()=>{
    btn.classList.remove('active');
    alert('Could not get your location. Showing Ahmedabad city centre instead.');
    map.setView(CITY_CENTER, 12);
  });
});

document.getElementById('btn-fullscreen').addEventListener('click', ()=>{
  const el = document.documentElement;
  if(!document.fullscreenElement){ el.requestFullscreen && el.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
});

/* ---------------------------------------------------------------------
   SIMPLE STRAIGHT-LINE ROUTE PREVIEW (right-click two points)
--------------------------------------------------------------------- */
let routePoints = [];
let routeLine = null, routeMarkers = [];
map.on('contextmenu', (e)=>{
  if(routePoints.length>=2){
    routePoints = []; if(routeLine) map.removeLayer(routeLine);
    routeMarkers.forEach(m=>map.removeLayer(m)); routeMarkers=[];
  }
  routePoints.push(e.latlng);
  const mk = L.circleMarker(e.latlng,{radius:6,color:'#fff',weight:2,fillColor:'#C9622D',fillOpacity:1}).addTo(map);
  routeMarkers.push(mk);
  if(routePoints.length===2){
    const distKm = (map.distance(routePoints[0], routePoints[1])/1000).toFixed(2);
    routeLine = L.polyline(routePoints,{color:'#C9622D', weight:3, dashArray:'6 6'}).addTo(map);
    routeLine.bindPopup(`<div class="pop-cat">Direct Route Preview</div><div class="pop-title">${distKm} km (straight line)</div><div class="pop-desc">Approximate straight-line distance — not a road route.</div>`).openPopup();
  }
});
